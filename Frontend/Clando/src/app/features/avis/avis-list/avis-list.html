<div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>⭐ Avis</h2>
        <button mat-raised-button color="primary" (click)="showForm = !showForm">
            <mat-icon>add</mat-icon> Donner un avis
        </button>
    </div>

    <!-- Formulaire ajout -->
    <mat-card *ngIf="showForm" style="margin-bottom: 20px; padding: 16px;">
        <mat-card-title>Nouvel avis</mat-card-title>
        <form [formGroup]="avisForm" (ngSubmit)="ajouterAvis()">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px;">

                <mat-form-field appearance="outline">
                    <mat-label>Note</mat-label>
                    <mat-select formControlName="note">
                        <mat-option *ngFor="let n of notes" [value]="n">
                            {{ getStars(n) }} ({{ n }}/5)
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>ID Destinataire</mat-label>
                    <input matInput formControlName="destinataireId" type="number">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>ID Trajet</mat-label>
                    <input matInput formControlName="trajetId" type="number">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Commentaire</mat-label>
                    <textarea matInput formControlName="commentaire" rows="3"></textarea>
                </mat-form-field>
            </div>

            <button mat-raised-button color="primary" type="submit"
                    [disabled]="avisForm.invalid">
                <mat-icon>send</mat-icon> Envoyer
            </button>
            <button mat-stroked-button type="button" (click)="showForm = false"
                    style="margin-left: 8px;">
                Annuler
            </button>
        </form>
    </mat-card>

    <!-- Liste des avis -->
    <p *ngIf="loading">Chargement...</p>

    <mat-card *ngIf="!loading && avis.length === 0"
              style="text-align: center; padding: 40px;">
        <mat-icon style="font-size: 48px;">star_border</mat-icon>
        <p>Aucun avis trouvé</p>
    </mat-card>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;">
        <mat-card *ngFor="let a of avis" style="padding: 16px;">
            <mat-card-header>
                <mat-card-title>{{ getStars(a.note) }}</mat-card-title>
                <mat-card-subtitle>
                    Pour : {{ a.destinataireNom }} {{ a.destinatairePrenom }}
                </mat-card-subtitle>
            </mat-card-header>

            <mat-card-content style="margin-top: 16px;">
                <p>{{ a.commentaire }}</p>
                <p style="color: gray; font-size: 12px;">
                    {{ a.dateAvis | date:'dd/MM/yyyy' }}
                </p>
            </mat-card-content>

            <mat-card-actions>
                <button mat-icon-button color="warn" (click)="supprimer(a.id!)">
                    <mat-icon>delete</mat-icon>
                </button>
            </mat-card-actions>
        </mat-card>
    </div>
</div>
