<div class="page-auth">
    <mat-card class="auth-card">

        <div class="auth-header">
            <mat-icon class="auth-icon">directions_car</mat-icon>
            <h1>Wayvo</h1>
            <p>Créez votre compte gratuitement</p>
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

            <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Nom</mat-label>
                    <input matInput formControlName="nom">
                    <mat-error *ngIf="registerForm.get('nom')?.hasError('required')">Nom obligatoire</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Prénom</mat-label>
                    <input matInput formControlName="prenom">
                    <mat-error *ngIf="registerForm.get('prenom')?.hasError('required')">Prénom obligatoire</mat-error>
                </mat-form-field>
            </div>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Email</mat-label>
                <input matInput formControlName="email" type="email">
                <mat-icon matSuffix>email</mat-icon>
                <mat-error *ngIf="registerForm.get('email')?.hasError('required')">Email obligatoire</mat-error>
                <mat-error *ngIf="registerForm.get('email')?.hasError('email')">Email invalide</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Mot de passe</mat-label>
                <input matInput formControlName="motDePasse" type="password">
                <mat-icon matSuffix>lock</mat-icon>
                <mat-error *ngIf="registerForm.get('motDePasse')?.hasError('required')">Mot de passe obligatoire</mat-error>
                <mat-error *ngIf="registerForm.get('motDePasse')?.hasError('minlength')">Minimum 6 caractères</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Téléphone</mat-label>
                <input matInput formControlName="telephone">
                <mat-icon matSuffix>phone</mat-icon>
            </mat-form-field>

            <button mat-raised-button type="submit"
                    [disabled]="registerForm.invalid || loading"
                    class="btn-submit">
                {{ loading ? 'Inscription...' : "S'inscrire" }}
            </button>
        </form>

        <div class="auth-footer">
            <p>Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
        </div>

    </mat-card>
</div>
