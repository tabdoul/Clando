<div style="display: flex; justify-content: center; margin-top: 80px;">
    <mat-card style="width: 400px; padding: 20px;">
        <mat-card-header>
            <mat-card-title>🚗 Wayvo - Inscription</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

                <mat-form-field appearance="outline" style="width: 100%; margin-top: 20px;">
                    <mat-label>Nom</mat-label>
                    <input matInput formControlName="nom">
                    <mat-error *ngIf="registerForm.get('nom')?.hasError('required')">
                        Nom obligatoire
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" style="width: 100%;">
                    <mat-label>Prénom</mat-label>
                    <input matInput formControlName="prenom">
                    <mat-error *ngIf="registerForm.get('prenom')?.hasError('required')">
                        Prénom obligatoire
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" style="width: 100%;">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email" type="email">
                    <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
                        Email obligatoire
                    </mat-error>
                    <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
                        Email invalide
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" style="width: 100%;">
                    <mat-label>Mot de passe</mat-label>
                    <input matInput formControlName="motDePasse" type="password">
                    <mat-error *ngIf="registerForm.get('motDePasse')?.hasError('required')">
                        Mot de passe obligatoire
                    </mat-error>
                    <mat-error *ngIf="registerForm.get('motDePasse')?.hasError('minlength')">
                        Minimum 6 caractères
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" style="width: 100%;">
                    <mat-label>Téléphone</mat-label>
                    <input matInput formControlName="telephone">
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit"
                        [disabled]="registerForm.invalid || loading"
                        style="width: 100%; margin-top: 10px;">
                    {{ loading ? 'Inscription...' : "S'inscrire" }}
                </button>
            </form>
        </mat-card-content>

        <mat-card-actions>
            <p style="text-align: center;">
                Déjà un compte ?
                <a routerLink="/login">Se connecter</a>
            </p>
        </mat-card-actions>
    </mat-card>
</div>
