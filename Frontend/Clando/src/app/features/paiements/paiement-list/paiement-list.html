<div>
    <h2>💳 Paiements</h2>

    <p *ngIf="loading">Chargement...</p>

    <mat-card *ngIf="!loading && paiements.length === 0"
              style="text-align: center; padding: 40px;">
        <mat-icon style="font-size: 48px;">payment</mat-icon>
        <p>Aucun paiement trouvé</p>
    </mat-card>

    <table mat-table [dataSource]="paiements"
           *ngIf="!loading && paiements.length > 0"
           style="width: 100%;">

        <ng-container matColumnDef="reservation">
            <th mat-header-cell *matHeaderCellDef>Réservation</th>
            <td mat-cell *matCellDef="let p">{{ p.reservationId }}</td>
        </ng-container>

        <ng-container matColumnDef="montant">
            <th mat-header-cell *matHeaderCellDef>Montant</th>
            <td mat-cell *matCellDef="let p">
                {{ p.montant | currency:'GNF':'symbol':'1.0-0' }}
            </td>
        </ng-container>

        <ng-container matColumnDef="methode">
            <th mat-header-cell *matHeaderCellDef>Méthode</th>
            <td mat-cell *matCellDef="let p">{{ p.methode }}</td>
        </ng-container>

        <ng-container matColumnDef="statut">
            <th mat-header-cell *matHeaderCellDef>Statut</th>
            <td mat-cell *matCellDef="let p">
                <mat-chip [color]="getStatutColor(p.statut)">
                    {{ p.statut }}
                </mat-chip>
            </td>
        </ng-container>

        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef>Date</th>
            <td mat-cell *matCellDef="let p">
                {{ p.datePaiement | date:'dd/MM/yyyy HH:mm' }}
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
