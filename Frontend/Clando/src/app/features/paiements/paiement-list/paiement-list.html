<div class="page">
    <div class="container">

        <div class="page-header">
            <h1>Paiements</h1>
        </div>

        <div *ngIf="loading" class="loading">
            <mat-icon>hourglass_empty</mat-icon>
            Chargement...
        </div>

        <div *ngIf="!loading && paiements.length === 0" class="empty-state">
            <mat-icon>payment</mat-icon>
            <p>Aucun paiement trouvé</p>
        </div>

        <div *ngIf="!loading && paiements.length > 0" class="table-card">
            <table mat-table [dataSource]="paiements" style="width: 100%;">

                <ng-container matColumnDef="reservation">
                    <th mat-header-cell *matHeaderCellDef>Réservation</th>
                    <td mat-cell *matCellDef="let p">#{{ p.reservationId }}</td>
                </ng-container>

                <ng-container matColumnDef="montant">
                    <th mat-header-cell *matHeaderCellDef>Montant</th>
                    <td mat-cell *matCellDef="let p">
                        <span class="montant">{{ p.montant | number }} GNF</span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="methode">
                    <th mat-header-cell *matHeaderCellDef>Méthode</th>
                    <td mat-cell *matCellDef="let p">{{ p.methode || 'Orange Money' }}</td>
                </ng-container>

                <ng-container matColumnDef="statut">
                    <th mat-header-cell *matHeaderCellDef>Statut</th>
                    <td mat-cell *matCellDef="let p">
                        <span class="statut-badge"
                              [ngClass]="{
                                'statut-effectue': p.statut === 'EFFECTUE' || p.statut === 'SUCCESS',
                                'statut-attente':  p.statut === 'EN_ATTENTE' || p.statut === 'PENDING',
                                'statut-echoue':   p.statut === 'ECHOUE' || p.statut === 'FAILED',
                                'statut-default':  !p.statut
                              }">
                            {{ p.statut || '—' }}
                        </span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="date">
                    <th mat-header-cell *matHeaderCellDef>Date</th>
                    <td mat-cell *matCellDef="let p">
                        {{ p.datePaiement | date:'dd/MM/yyyy HH:mm' }}
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>

    </div>
</div>
