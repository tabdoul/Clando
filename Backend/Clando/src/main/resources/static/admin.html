<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clando Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #eee; }
        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0;
            width: 240px; background: #1a1a1a;
            border-right: 1px solid #2a2a2a; padding: 24px 0;
        }
        .logo {
            font-size: 28px; font-weight: bold; color: #00b5e2;
            letter-spacing: 3px; text-align: center; padding: 0 24px 24px;
            border-bottom: 1px solid #2a2a2a;
        }
        .logo span { font-size: 12px; display: block; color: #666; letter-spacing: 1px; margin-top: 4px; }
        .nav { margin-top: 16px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 24px; cursor: pointer; color: #888;
            transition: all 0.2s; border-left: 3px solid transparent;
        }
        .nav-item:hover, .nav-item.active { color: #00b5e2; background: #0a2a35; border-left-color: #00b5e2; }
        .nav-item svg { width: 20px; height: 20px; }
        .main { margin-left: 240px; padding: 32px; }
        .page { display: none; }
        .page.active { display: block; }
        h1 { font-size: 24px; margin-bottom: 24px; color: #eee; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: #1e1e1e; border-radius: 14px; padding: 20px; border: 1px solid #2a2a2a; border-left: 3px solid #00b5e2; }
        .stat-card.rouge { border-left-color: #e74c3c; }
        .stat-card.vert { border-left-color: #2ecc71; }
        .stat-card.orange { border-left-color: #f39c12; }
        .stat-value { font-size: 36px; font-weight: bold; color: #00b5e2; }
        .stat-card.rouge .stat-value { color: #e74c3c; }
        .stat-card.vert .stat-value { color: #2ecc71; }
        .stat-card.orange .stat-value { color: #f39c12; }
        .stat-label { font-size: 13px; color: #888; margin-top: 4px; }
        .card { background: #1e1e1e; border-radius: 14px; padding: 20px; border: 1px solid #2a2a2a; margin-bottom: 16px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .card-title { font-size: 16px; font-weight: 600; color: #eee; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px 12px; color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #2a2a2a; }
        td { padding: 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #ddd; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #252525; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-attente { background: #3a2a1a; color: #f39c12; }
        .badge-valide { background: #1a3a2a; color: #2ecc71; }
        .badge-rejete { background: #3a1a1a; color: #e74c3c; }
        .badge-ouvert { background: #3a1a1a; color: #e74c3c; }
        .badge-resolu { background: #1a3a2a; color: #2ecc71; }
        .btn { padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.8; }
        .btn-primary { background: #00b5e2; color: white; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #00b5e2; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; color: white; }
        .avatar-img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #1e1e1e; border-radius: 16px; padding: 24px; border: 1px solid #2a2a2a; width: 500px; max-width: 90%; }
        .modal h2 { font-size: 18px; margin-bottom: 16px; }
        .modal textarea { width: 100%; background: #252525; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px; color: #eee; font-size: 14px; resize: vertical; min-height: 100px; margin-bottom: 16px; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; }
        .search-input { background: #252525; border: 1px solid #2a2a2a; border-radius: 8px; padding: 8px 14px; color: #eee; font-size: 14px; width: 250px; }
        .search-input:focus { outline: none; border-color: #00b5e2; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .empty { text-align: center; padding: 40px; color: #666; font-size: 14px; }
        .doc-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 1px solid #2a2a2a; }
        .verifie { color: #2ecc71; font-size: 12px; }
        .non-verifie { color: #666; font-size: 12px; }
    </style>
</head>
<body>

<div id="login-page" style="position: fixed; inset: 0; background: #0f0f0f; display: flex; align-items: center; justify-content: center; z-index: 999;">
    <div style="background: #1e1e1e; border-radius: 16px; padding: 40px; border: 1px solid #2a2a2a; width: 360px; text-align: center;">
        <div style="font-size: 36px; font-weight: bold; color: #00b5e2; letter-spacing: 3px; margin-bottom: 8px;">CLANDO</div>
        <div style="color: #666; font-size: 13px; margin-bottom: 32px;">Administration</div>
        <input id="login-password" type="password" placeholder="Mot de passe admin"
            style="width: 100%; background: #252525; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px 16px; color: #eee; font-size: 15px; margin-bottom: 16px;"
            onkeydown="if(event.key==='Enter') seConnecter()">
        <div id="login-error" style="color: #e74c3c; font-size: 13px; margin-bottom: 12px; display: none;">Mot de passe incorrect</div>
        <button onclick="seConnecter()" style="width: 100%; background: #00b5e2; color: white; border: none; border-radius: 8px; padding: 14px; font-size: 15px; font-weight: bold; cursor: pointer;">Se connecter</button>
    </div>
</div>

<div class="sidebar">
    <div class="logo">WAYVO <span>Administration</span></div>
    <nav class="nav">
        <div class="nav-item active" onclick="showPage('dashboard')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
            </svg>
            Tableau de bord
        </div>
        <div class="nav-item" onclick="showPage('documents')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
            </svg>
            Documents
        </div>
        <div class="nav-item" onclick="showPage('signalements')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            Signalements
        </div>
        <div class="nav-item" onclick="showPage('utilisateurs')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Utilisateurs
        </div>
    </nav>
</div>

<div class="main">
    <div id="page-dashboard" class="page active">
        <h1>Tableau de bord</h1>
        <div class="stats-grid" id="stats-grid"><div class="loading">Chargement...</div></div>
    </div>
    <div id="page-documents" class="page">
        <h1>Documents à valider</h1>
        <div class="card"><div id="documents-table"><div class="loading">Chargement...</div></div></div>
    </div>
    <div id="page-signalements" class="page">
        <h1>Signalements</h1>
        <div class="card"><div id="signalements-table"><div class="loading">Chargement...</div></div></div>
    </div>
    <div id="page-utilisateurs" class="page">
        <h1>Utilisateurs</h1>
        <div class="card">
            <div class="card-header">
                <span class="card-title" id="nb-utilisateurs">Tous les utilisateurs</span>
                <input class="search-input" type="text" placeholder="Rechercher..." oninput="filtrerUtilisateurs(this.value)">
            </div>
            <div id="utilisateurs-table"><div class="loading">Chargement...</div></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-signalement">
    <div class="modal">
        <h2>Répondre au signalement</h2>
        <textarea id="reponse-texte" placeholder="Votre réponse..."></textarea>
        <div class="modal-actions">
            <button class="btn btn-danger" onclick="fermerModal()">Annuler</button>
            <button class="btn btn-success" onclick="envoyerReponse()">Envoyer</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-image">
    <div class="modal" style="text-align:center">
        <img id="modal-img" src="" style="max-width:100%; border-radius:8px; margin-bottom:16px">
        <button class="btn btn-danger" onclick="fermerModalImage()">Fermer</button>
    </div>
</div>

<script>
    // IMPORTANT: API doit être déclaré en premier
    const API = 'https://clando-production.up.railway.app';
    const ADMIN_PASSWORD = 'abdoul';
    let tousUtilisateurs = [];
    let signalementEnCours = null;

    function seConnecter() {
        const pwd = document.getElementById('login-password').value;
        if (pwd === ADMIN_PASSWORD) {
            document.getElementById('login-page').style.display = 'none';
            sessionStorage.setItem('admin_auth', 'true');
            chargerStats();
        } else {
            document.getElementById('login-error').style.display = 'block';
            document.getElementById('login-password').value = '';
        }
    }

    if (sessionStorage.getItem('admin_auth') === 'true') {
        document.getElementById('login-page').style.display = 'none';
        chargerStats();
    }

    async function get(url) {
        const r = await fetch(API + url);
        return r.json();
    }

    async function patch(url) {
        const r = await fetch(API + url, { method: 'PATCH' });
        return r.json();
    }

    function showPage(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('page-' + page).classList.add('active');
        event.currentTarget.classList.add('active');
        if (page === 'dashboard') chargerStats();
        if (page === 'documents') chargerDocuments();
        if (page === 'signalements') chargerSignalements();
        if (page === 'utilisateurs') chargerUtilisateurs();
    }

    async function chargerStats() {
        const stats = await get('/api/admin/stats');
        document.getElementById('stats-grid').innerHTML = `
            <div class="stat-card">
                <div class="stat-value">${stats.nbUtilisateurs}</div>
                <div class="stat-label">Utilisateurs inscrits</div>
            </div>
            <div class="stat-card vert">
                <div class="stat-value">${stats.nbTrajets}</div>
                <div class="stat-label">Trajets publiés</div>
            </div>
            <div class="stat-card orange">
                <div class="stat-value">${stats.nbReservations}</div>
                <div class="stat-label">Réservations totales</div>
            </div>
            <div class="stat-card rouge">
                <div class="stat-value">${stats.nbDocumentsEnAttente}</div>
                <div class="stat-label">Documents en attente</div>
            </div>
            <div class="stat-card rouge">
                <div class="stat-value">${stats.nbSignalementsOuverts}</div>
                <div class="stat-label">Signalements ouverts</div>
            </div>
        `;
    }

    async function chargerDocuments() {
        const docs = await get('/api/admin/documents');
        if (docs.length === 0) {
            document.getElementById('documents-table').innerHTML = '<div class="empty">Aucun document en attente ✓</div>';
            return;
        }
        document.getElementById('documents-table').innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Aperçu</th>
                        <th>Utilisateur</th>
                        <th>Type</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${docs.map(d => `
                        <tr>
                            <td>
                                <img class="doc-preview"
                                    src="${API}/api/documents/fichier/${d.id}"
                                    onclick="voirImage('${API}/api/documents/fichier/${d.id}')"
                                    onerror="this.style.display='none'">
                            </td>
                            <td>${d.utilisateurPrenom} ${d.utilisateurNom}</td>
                            <td><span class="badge badge-attente">${formatType(d.type)}</span></td>
                            <td>${formatDate(d.dateUpload)}</td>
                            <td style="display:flex;gap:8px">
                                <button class="btn btn-success btn-sm" onclick="validerDoc(${d.id}, true)">✓ Valider</button>
                                <button class="btn btn-danger btn-sm" onclick="validerDoc(${d.id}, false)">✗ Rejeter</button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    async function validerDoc(id, accepte) {
        const commentaire = accepte ? 'Document valide' : prompt('Motif du rejet :') || 'Document invalide';
        await fetch(`${API}/api/admin/documents/${id}/valider?accepte=${accepte}&commentaire=${encodeURIComponent(commentaire)}`, { method: 'PATCH' });
        chargerDocuments();
        chargerStats();
    }

    async function chargerSignalements() {
        const sigs = await get('/api/admin/signalements');
        if (sigs.length === 0) {
            document.getElementById('signalements-table').innerHTML = '<div class="empty">Aucun signalement ouvert ✓</div>';
            return;
        }
        document.getElementById('signalements-table').innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Utilisateur</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${sigs.map(s => `
                        <tr>
                            <td>${s.utilisateurPrenom} ${s.utilisateurNom}</td>
                            <td><span class="badge badge-ouvert">${formatType(s.type)}</span></td>
                            <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.description}</td>
                            <td>${formatDate(s.dateSignalement)}</td>
                            <td>
                                <button class="btn btn-primary btn-sm" onclick="ouvrirModal(${s.id})">Répondre</button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    function ouvrirModal(id) {
        signalementEnCours = id;
        document.getElementById('reponse-texte').value = '';
        document.getElementById('modal-signalement').classList.add('active');
    }

    function fermerModal() {
        document.getElementById('modal-signalement').classList.remove('active');
    }

    async function envoyerReponse() {
        const reponse = document.getElementById('reponse-texte').value;
        if (!reponse.trim()) return alert('Veuillez écrire une réponse');
        await fetch(`${API}/api/admin/signalements/${signalementEnCours}/repondre?reponse=${encodeURIComponent(reponse)}`, { method: 'PATCH' });
        fermerModal();
        chargerSignalements();
        chargerStats();
    }

    async function chargerUtilisateurs() {
        tousUtilisateurs = await get('/api/admin/utilisateurs');
        afficherUtilisateurs(tousUtilisateurs);
    }

    function afficherUtilisateurs(users) {
        document.getElementById('nb-utilisateurs').textContent = `${users.length} utilisateur(s)`;
        document.getElementById('utilisateurs-table').innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th>Inscription</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody>
                    ${users.map(u => `
                        <tr>
                            <td>
                                ${u.photo
                                    ? `<img class="avatar-img" src="${API}/api/utilisateurs/photo/${u.photo.split('\\\\').pop().split('/').pop()}">`
                                    : `<div class="avatar">${(u.prenom||'?')[0]}${(u.nom||'?')[0]}</div>`
                                }
                            </td>
                            <td>${u.prenom} ${u.nom}</td>
                            <td>${u.email}</td>
                            <td>${u.telephone || '-'}</td>
                            <td>${formatDate(u.dateInscription)}</td>
                            <td>${u.verifie
                                ? '<span class="verifie">✓ Vérifié</span>'
                                : '<span class="non-verifie">Non vérifié</span>'}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    function filtrerUtilisateurs(query) {
        const filtered = tousUtilisateurs.filter(u =>
            `${u.prenom} ${u.nom} ${u.email}`.toLowerCase().includes(query.toLowerCase())
        );
        afficherUtilisateurs(filtered);
    }

    function voirImage(url) {
        document.getElementById('modal-img').src = url;
        document.getElementById('modal-image').classList.add('active');
    }

    function fermerModalImage() {
        document.getElementById('modal-image').classList.remove('active');
    }

    function formatType(type) {
        const types = {
            'CNI': 'CNI', 'PASSEPORT': 'Passeport', 'PERMIS_CONDUIRE': 'Permis',
            'CERTIFICAT_IMMATRICULATION': 'Carte grise', 'PROBLEME_TECHNIQUE': 'Problème technique',
            'COMPORTEMENT_INAPPROPRIE': 'Comportement', 'ARNAQUE': 'Arnaque',
            'TRAJET_ANNULE': 'Trajet annulé', 'AUTRE': 'Autre'
        };
        return types[type] || type;
    }

    function formatDate(dateStr) {
        if (!dateStr) return '-';
        return new Date(dateStr).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    chargerStats();
</script>
</body>
</html>
