<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement confirmé - WayVo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #121212; color: #eee;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 24px;
        }
        .card {
            background: #1e1e1e; border-radius: 20px; padding: 40px;
            text-align: center; max-width: 400px; width: 100%;
            border: 1px solid #2a2a2a;
        }
        .icon {
            width: 80px; height: 80px; border-radius: 50%;
            background: #1a3a2a; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 24px;
            font-size: 40px;
        }
        h1 { font-size: 24px; color: #2ecc71; margin-bottom: 12px; }
        p { font-size: 15px; color: #888; line-height: 1.6; margin-bottom: 8px; }
        .transaction {
            background: #252525; border-radius: 10px; padding: 12px;
            margin: 20px 0; font-size: 13px; color: #666;
        }
        .transaction span { color: #00b5e2; font-weight: 600; }
        .bouton {
            display: inline-block; background: #00b5e2; color: white;
            padding: 14px 32px; border-radius: 12px; text-decoration: none;
            font-weight: bold; font-size: 15px; margin-top: 8px;
            cursor: pointer; border: none; width: 100%;
        }
        .bouton:hover { opacity: 0.9; }
        .countdown {
            font-size: 13px; color: #666; margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>Paiement confirmé !</h1>
        <p>Votre paiement a été effectué avec succès.</p>
        <p>Votre réservation est en attente de confirmation du conducteur.</p>

        <div class="transaction" id="transaction-info">
            Transaction ID : <span id="transaction-id">-</span>
        </div>

        <p style="font-size: 13px; color: #666; margin-top: 8px;">
            Vous allez être redirigé automatiquement vers WayVo...
        </p>

        <button class="bouton" onclick="retournerApp()">
            Retourner sur Wayvo
        </button>

        <p class="countdown" id="countdown"></p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const transactionId = params.get('transactionId');

        if (transactionId) {
            document.getElementById('transaction-id').textContent = transactionId;
        }

        //  Deep link vers l'écran Réservations avec paramètre succès
        function retournerApp() {
            // Le deep link ouvre l'app et navigue vers ReservationsScreen
            window.location.href = 'clandomobile://paiement-succes';
        }

        //  Redirection automatique après 3 secondes
        let secondes = 3;
        const countdownEl = document.getElementById('countdown');

        const timer = setInterval(() => {
            countdownEl.textContent = `Redirection automatique dans ${secondes}s...`;
            secondes--;
            if (secondes < 0) {
                clearInterval(timer);
                retournerApp();
            }
        }, 1000);
    </script>
</body>
</html>
