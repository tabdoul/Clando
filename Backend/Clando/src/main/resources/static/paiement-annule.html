<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement annulé - Clando</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #121212; color: #eee;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 24px;
        }
        .card {
            background: #1e1e1e; border-radius: 20px; padding: 40px;
            text-align: center; max-width: 400px; width: 100%;
            border: 1px solid #2a2a2a;
        }
        .icon {
            width: 80px; height: 80px; border-radius: 50%;
            background: #3a1a1a; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 24px;
            font-size: 40px;
        }
        h1 { font-size: 24px; color: #e74c3c; margin-bottom: 12px; }
        p { font-size: 15px; color: #888; line-height: 1.6; margin-bottom: 8px; }
        .bouton {
            display: inline-block; background: #00b5e2; color: white;
            padding: 14px 32px; border-radius: 12px; text-decoration: none;
            font-weight: bold; font-size: 15px; margin-top: 20px;
            cursor: pointer; border: none; width: 100%;
        }
        .bouton-outline {
            display: inline-block; border: 1px solid #444; color: #888;
            padding: 14px 32px; border-radius: 12px; text-decoration: none;
            font-weight: bold; font-size: 15px; margin-top: 10px;
            cursor: pointer; background: transparent; width: 100%;
        }
        .bouton:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">❌</div>
        <h1>Paiement annulé</h1>
        <p>Votre paiement a été annulé.</p>
        <p>Votre réservation a été annulée et les places ont été restituées.</p>
        <p style="font-size: 13px; color: #666; margin-top: 12px;">
            Vous pouvez réessayer en faisant une nouvelle réservation depuis l'application.
        </p>

        <button class="bouton" onclick="retournerApp()">
            Retourner sur Clando
        </button>
        <button class="bouton-outline" onclick="window.close()">
            Fermer
        </button>
    </div>

    <script>
        function retournerApp() {
            window.location.href = 'clandomobile://';
            setTimeout(() => {
                window.close();
            }, 2000);
        }
    </script>
</body>
</html>
